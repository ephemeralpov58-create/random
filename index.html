<!DOCTYPE html>
<html>
<head>
  <title>PLAY</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <style>
    body {
      background: #000;
      color: #fff;
      font-family: "Courier New", monospace;
      text-align: center;
      margin-top: 12vh;
    }

    h1 {
      letter-spacing: 8px;
      font-size: 42px;
      margin-bottom: 50px;
    }

    .btn {
      display: block;
      width: fit-content;
      margin: 16px auto;
      padding: 16px 28px;
      background: transparent;
      border: 4px solid #fff;
      border-radius: 100px;
      color: #fff;
      font-family: "Courier New", monospace;
      font-size: 18px;
      cursor: pointer;
      transition: 0.2s;
      letter-spacing: 2px;
      white-space: nowrap;
    }

    .btn:hover {
      background: #fff;
      color: #000;
    }

    .rainbow {
      border: 1.9px solid transparent;
      border-radius: 10px;
      background: linear-gradient(#000, #000) padding-box,
                  linear-gradient(
                    90deg,
                    red,
                    orange,
                    yellow,
                    lime,
                    cyan,
                    blue,
                    violet,
                    red
                  ) border-box;
      animation: hue 4s linear infinite;
    }

    @keyframes hue {
      0%   { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }

    .links {
      margin-top: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
    }

    .links a {
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .social-icon {
      width: 42px;
      height: 42px;
      color: #fff;
      transition: transform 0.25s ease;
      animation: iconRainbow 4s linear infinite;
    }

    @keyframes iconRainbow {
      0%   { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }

    .links a:hover .social-icon {
      transform: scale(1.2);
      filter:
        drop-shadow(0 0 5px #fff)
        drop-shadow(0 0 10px currentColor);
    }

    .top-disclaimer { margin: 0 auto 34px; padding: 0 14px; }
    .top-disclaimer .primary { font-size: clamp(14px, 3.5vw, 18px); font-weight: bold; letter-spacing: 2px; }
    .top-disclaimer .secondary { margin-top: 7px; font-size: clamp(10px, 2.7vw, 13px); color: #bbb; letter-spacing: .3px; }
    .bottom-disclaimer { margin: 24px 12px 32px; font-size: clamp(13px, 3.3vw, 17px); font-weight: bold; letter-spacing: 2px; }

    #videoOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 9999;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      justify-content: center;
      align-items: center;
    }

    #videoOverlay video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    #closeBtn {
      position: absolute;
      top: max(15px, env(safe-area-inset-top));
      right: max(20px, env(safe-area-inset-right));
      font-size: 40px;
      color: #fff;
      cursor: pointer;
      z-index: 10000;
    }

    .at-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: "Times New Roman", monospace;
    font-size: 42px;
    font-weight: bold;
    line-height: 1;
}
  </style>
</head>

<body>

<div class="top-disclaimer">
  <div class="primary">PLAY ME OUTLOUD</div>
  <div class="secondary">(Remove the tape from your phones camera)</div>
</div>

<h1 id="scrambleTitle">*$?#</h1>

<button class="btn rainbow" onclick="playRandomVideo()">
  PLAY ME
</button>

<div class="links">

 <a href="https://soundcloud.com/filthyfranktv123"
   target="_blank"
   rel="noopener noreferrer"
   aria-label="SoundCloud">
    <span class="social-icon at-icon">@</span>
</a>

  <a href="https://instagram.com/_480hz" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
    <svg viewBox="0 0 24 24" class="social-icon" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle cx="17.5" cy="6.5" r="1.2" fill="currentColor"/>
    </svg>
  </a>

  <a href="https://www.youtube.com/watch?v=hRlIUqOuiVs&list=LL&index=30" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
    <svg viewBox="0 0 24 24" class="social-icon" aria-hidden="true">
      <path fill="currentColor" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.6 15.9V8.1l6.5 3.9-6.5 3.9z"/>
    </svg>
  </a>

</div>

<div class="bottom-disclaimer">TURN YOUR VOLUME UP</div>

<div id="videoOverlay">
  <div id="closeBtn" onclick="closeVideo()">✕</div>
  <video id="mainVideo" controls playsinline webkit-playsinline disablepictureinpicture></video>
</div>

<script>
/* ---------- VIDEO LIST ---------- */
const videos = [
  

  "Wiser389.mp4",
  "NFL Chunk2.mp4",
  "forward34.mp4",
  
];

// Set to false if you want it to stop after each video instead of
// automatically jumping to another random one.
const AUTO_NEXT = true;

/* ---------- SHUFFLE BAG ----------
   All videos are shuffled into a "bag". Each press draws the next one,
   so every video plays once before any can repeat. The bag and the last
   video played are remembered between page reloads, so refreshing the
   page doesn't reset the randomness. */
const STORE_KEY = "playQueueV1";
let queue = [];
let lastPlayed = null;

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY));
    if (saved) {
      // keep only videos that still exist in the list
      queue = (saved.queue || []).filter(v => videos.includes(v));
      lastPlayed = videos.includes(saved.lastPlayed) ? saved.lastPlayed : null;
    }
  } catch (e) { /* storage unavailable, that's fine */ }
}

function saveState() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ queue, lastPlayed }));
  } catch (e) { /* ignore */ }
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function nextVideo() {
  if (queue.length === 0) {
    queue = shuffle([...videos]);

    // never start a new round with the video that just played
    if (queue.length > 1 && queue[0] === lastPlayed) {
      const swapWith = 1 + Math.floor(Math.random() * (queue.length - 1));
      [queue[0], queue[swapWith]] = [queue[swapWith], queue[0]];
    }
  }

  lastPlayed = queue.shift();
  saveState();
  return lastPlayed;
}

function playRandomVideo() {
  playVideo(nextVideo());
}

loadState();

/* ---------- PLAYER ---------- */
const overlay = document.getElementById("videoOverlay");
const video = document.getElementById("mainVideo");

function playVideo(file) {
  video.src = encodeURI(file);   // handles the space in "Ram08 FINALIZED.mp4"
  video.load();
  overlay.style.display = "flex";
  document.body.style.overflow = "hidden";
  video.play().catch(() => {});
}

function closeVideo() {
  video.pause();
  video.removeAttribute("src");
  video.load();
  overlay.style.display = "none";
  document.body.style.overflow = "";
}

video.addEventListener("ended", () => {
  if (AUTO_NEXT) playRandomVideo();
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeVideo();
});

/* ---------- SCRAMBLING TITLE ---------- */
const scrambleCharacters = "*$#";

function scrambleTitle() {
  let scrambled = "";
  for (let i = 0; i < 3; i++) {
    scrambled += scrambleCharacters[
      Math.floor(Math.random() * scrambleCharacters.length)
    ];
  }
  document.getElementById("scrambleTitle").textContent = scrambled;
}

setInterval(scrambleTitle, 90);
</script>

</body>
</html>
